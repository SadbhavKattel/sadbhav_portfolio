<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word to Vector</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F4EE;
    --panel: #FFFFFF;
    --panel-border: rgba(27, 27, 24, 0.12);
    --accent: #2F6FED;
    --good: #1f7a4d;
    --bad: #c23b2b;
    --text: #1B1B18;
    --text-dim: #6B655D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  #topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 2.2vw, 16px);
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .brand-vector {
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.34em;
    padding-left: 0.2em;
  }

  .brand-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(47, 111, 237, 0.5);
    flex-shrink: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: border-color 160ms ease, color 160ms ease;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .primary-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    width: 100%;
    box-shadow: 0 8px 18px rgba(47, 111, 237, 0.25);
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .primary-btn:hover { transform: translateY(-1px); }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .secondary-btn {
    background: #fff;
    color: var(--text);
    border: 2px solid var(--text);
    box-shadow: none;
  }

  #stage {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px;
    flex: 1;
  }

  #canvasPane { width: 100%; }

  #canvasContainer {
    position: relative;
    width: 100%;
    height: 340px;
    border-radius: 20px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #FFFFFF 0%, #ECE7DA 70%);
    border: 1px solid var(--panel-border);
  }

  #glcanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #glcanvas:active { cursor: grabbing; }

  #labelLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .vlabel {
    position: absolute;
    transform: translate(-50%, -145%);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .vlabel-below {
    transform: translate(-50%, 45%);
  }
  .guess-vector-label {
    background: #fff;
    border: 1px solid var(--panel-border);
    color: var(--accent);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-weight: 600;
    font-size: 10px;
  }
  .vlabel-target {
    background: #fff;
    border: 1px solid currentColor;
    font-weight: 800;
  }
  .axis-label {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0;
  }

  /* --- demo widget --- */
  #demoWindow {
    position: absolute;
    left: 12px;
    top: 12px;
    width: min(258px, 68vw);
    z-index: 20;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 10px;
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 24px rgba(27, 27, 24, 0.14);
  }
  .demo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .demo-title {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .demo-close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
  }
  .demo-close-btn:hover { color: var(--text); }
  #demoCode {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 9.5px;
    line-height: 1.6;
    color: var(--good);
    min-height: 64px;
    white-space: pre;
    overflow: hidden;
  }
  .code-line { white-space: pre; }
  #demoCanvasWrap { position: relative; width: 100%; height: 130px; margin-top: 4px; border-radius: 8px; overflow: hidden; background: rgba(27, 27, 24, 0.03); }
  #demoCanvas { display: block; width: 100%; height: 100%; }
  #demoLabelLayer { position: absolute; inset: 0; pointer-events: none; }
  .demo-axis-label {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 7.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .demo-word-label {
    position: absolute;
    transform: translate(-50%, -130%);
    font-size: 9px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  #demoPill {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 20;
    display: none;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--panel-border);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    box-shadow: 0 6px 16px rgba(27, 27, 24, 0.1);
  }
  #demoPill:hover { border-color: var(--accent); }

  #controlPane {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    max-height: 620px;
    scrollbar-width: thin;
    scrollbar-color: rgba(47, 111, 237, 0.3) transparent;
  }
  #controlPane::-webkit-scrollbar { width: 6px; }
  #controlPane::-webkit-scrollbar-track { background: transparent; }
  #controlPane::-webkit-scrollbar-thumb { background: rgba(47, 111, 237, 0.25); border-radius: 999px; }
  #controlPane::-webkit-scrollbar-thumb:hover { background: rgba(47, 111, 237, 0.45); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(27, 27, 24, 0.05);
  }

  .hidden { display: none !important; }

  .theme-indicator {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .theme-indicator span { color: var(--accent); }

  .target-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(27, 27, 24, 0.03);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .target-emoji { font-size: 34px; line-height: 1; }
  .target-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .target-word {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
  }
  .target-word-bracket { color: var(--text-dim); }
  .target-word-spaced { letter-spacing: 0.26em; padding: 0 0.12em; }

  .slider-row { margin-bottom: 14px; }
  .slider-row-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }
  .slider-value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .vslider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(27, 27, 24, 0.12);
    outline: none;
  }
  .vslider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.18);
    cursor: pointer;
    border: 2px solid var(--bg);
  }
  .vslider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.18);
    cursor: pointer;
    border: 2px solid var(--bg);
  }
  .vslider:disabled::-webkit-slider-thumb { background: #b9b3a7; box-shadow: none; }
  .vslider:disabled { opacity: 0.6; }

  #revealPanel {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--panel-border);
  }
  .rank-badge {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 6px 18px;
    border-radius: 8px;
    margin-bottom: 12px;
    color: #fff;
  }
  .reveal-score-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .reveal-score-row .big {
    font-size: 30px;
    font-weight: 900;
  }
  .coord-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .coord-row span:last-child { color: var(--text); }

  #historyPanel { margin-top: 6px; }
  .history-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    background: rgba(27, 27, 24, 0.03);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .history-item .hi-word { display: flex; align-items: center; gap: 6px; }
  .history-item .hi-score { font-weight: 700; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(27, 27, 24, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal {
    width: 100%;
    max-width: 560px;
    max-height: 80vh;
    background: #fff;
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal p.hint { margin: 0 0 12px; font-size: 12px; color: var(--text-dim); }
  #exportTextarea {
    width: 100%;
    flex: 1;
    min-height: 220px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 11px;
    resize: vertical;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .modal-actions .ghost-btn, .modal-actions .primary-btn { width: auto; flex: 1; }

  #resetRow { display: flex; justify-content: center; }

  @media (min-width: 860px) {
    #stage { flex: 0 0 auto; flex-direction: row; height: 660px; min-height: 0; }
    #canvasPane { flex: 0 0 60%; height: 100%; }
    #canvasContainer { height: 100%; }
    #controlPane { flex: 0 0 40%; height: 100%; max-height: none; min-height: 0; }
  }
</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">WORD TO [<span class="brand-vector">VECTOR</span>]</span>
      </div>
      <div class="topbar-right">
        <button id="exportBtn" class="ghost-btn" type="button">Export</button>
      </div>
    </header>

    <main id="stage">
      <section id="canvasPane">
        <div id="canvasContainer">
          <canvas id="glcanvas"></canvas>
          <div id="labelLayer"></div>

          <div id="demoWindow">
            <div class="demo-header">
              <span class="demo-title">Embeddings Demo</span>
              <button id="demoCloseBtn" class="demo-close-btn" type="button">&times;</button>
            </div>
            <div id="demoCode"></div>
            <div id="demoCanvasWrap">
              <canvas id="demoCanvas"></canvas>
              <div id="demoLabelLayer"></div>
            </div>
          </div>

          <button id="demoPill" type="button">&#9654; Watch Demo</button>
        </div>
      </section>

      <aside id="controlPane">
        <div id="gamePanel" class="panel">
          <div class="theme-indicator"><span id="themeName"></span> Cluster</div>
          <div class="target-card">
            <div class="target-emoji" id="targetEmoji"></div>
            <div>
              <div class="target-label">Guess this word&rsquo;s vector</div>
              <div class="target-word">
                <span class="target-word-bracket">[</span><span id="targetWordSpaced" class="target-word-spaced"></span><span class="target-word-bracket">]</span>
              </div>
            </div>
          </div>

          <div id="slidersContainer"></div>

          <button id="submitBtn" class="primary-btn" type="button">Submit Vector</button>

          <div id="revealPanel" class="hidden">
            <div class="rank-badge" id="rankBadge">GREAT</div>
            <div class="reveal-score-row"><span class="big" id="revealScore">0%</span><span>match</span></div>

            <div class="coord-row"><span>Your vector</span><span id="revealYourVec">(0, 0, 0)</span></div>
            <div class="coord-row"><span>True vector</span><span id="revealTrueVec">(0, 0, 0)</span></div>

            <button id="nextWordBtn" class="primary-btn secondary-btn" type="button" style="margin-top: 14px;">Try Another Word</button>
          </div>

          <div id="historyPanel" class="hidden">
            <div class="history-title">This Session</div>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>

        <div id="resetRow">
          <button id="resetBtn" class="ghost-btn" type="button">Reset Graph &amp; Shuffle Theme</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="exportModal" class="modal-backdrop hidden">
    <div class="modal">
      <h3>Export Component</h3>
      <p class="hint">Copies the full standalone HTML for this widget so you can drop it into any page or portfolio.</p>
      <textarea id="exportTextarea" readonly spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="copyExportBtn" class="primary-btn" type="button">Copy HTML</button>
        <button id="closeExportBtn" class="ghost-btn" type="button">Close</button>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var SCALE = 2.6;
  var AXIS_LEN = SCALE * 1.25;
  var DEMO_SCALE = 1.7;
  var DEMO_AXIS_LEN = DEMO_SCALE * 1.3;
  var ACCENT_COLOR = 0x2F6FED;

  // --- math helpers -------------------------------------------------------

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function mag(a) { return Math.sqrt(dot(a, a)); }
  function cosineSimilarity(a, b) {
    var ma = mag(a), mb = mag(b);
    if (ma < 1e-6 || mb < 1e-6) return 0;
    return dot(a, b) / (ma * mb);
  }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function vecToWorld(v, scale) { return new THREE.Vector3(v[0] * scale, v[1] * scale, v[2] * scale); }
  function fmtVec(v) { return '(' + v.map(function (n) { return n.toFixed(2); }).join(', ') + ')'; }
  function fmtVecLive(v) {
    return '[ ' + v.map(function (n) {
      var s = n.toFixed(2);
      return (n >= 0 ? ' ' : '') + s;
    }).join(', ') + ' ]';
  }
  function sleep(ms, timerBag) {
    return new Promise(function (resolve) {
      timerBag.push(setTimeout(resolve, ms));
    });
  }

  function easeOutElastic(t) {
    if (t === 0) return 0;
    if (t === 1) return 1;
    var c4 = (2 * Math.PI) / 3;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  }

  function lerpColor(hexA, hexB, t) {
    var a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
    var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    var r = Math.round(ar + (br - ar) * t);
    var g = Math.round(ag + (bg - ag) * t);
    var bl = Math.round(ab + (bb - ab) * t);
    return 'rgb(' + r + ', ' + g + ', ' + bl + ')';
  }

  // --- game data ------------------------------------------------------------
  // "True" embeddings below are hand-authored to demonstrate the geometry
  // of each axis set; they are not pulled from a real trained model.

  var DEMO_AXES = ['Masculinity', 'Power', 'Maturity'];
  var DEMO_WORDS = [
    { varName: 'king', label: 'King', emoji: '👑', color: '#D4A017', vec: [0.85, 0.95, 0.90] },
    { varName: 'queen', label: 'Queen', emoji: '👑', color: '#9C6ADE', vec: [-0.85, 0.90, 0.90] },
    { varName: 'prince', label: 'Prince', emoji: '🤴', color: '#4C6EF5', vec: [0.80, 0.35, -0.60] },
    { varName: 'princess', label: 'Princess', emoji: '👸', color: '#F06292', vec: [-0.80, 0.30, -0.60] },
  ];

  var THEMES = [
    {
      name: 'Produce',
      axes: ['Sweetness', 'Redness', 'Crunchiness'],
      words: [
        { label: 'Apple', emoji: '🍎', color: '#D62828', vec: [0.60, 0.80, 0.55] },
        { label: 'Banana', emoji: '🍌', color: '#E8B923', vec: [0.85, -0.75, -0.55] },
        { label: 'Watermelon', emoji: '🍉', color: '#2F9E44', vec: [0.50, 0.45, 0.25] },
        { label: 'Grape', emoji: '🍇', color: '#6F42C1', vec: [0.45, -0.25, -0.20] },
        { label: 'Lemon', emoji: '🍋', color: '#F1C40F', vec: [-0.75, -0.55, 0.05] },
      ],
    },
    {
      name: 'Wildlife',
      axes: ['Size', 'Ferocity', 'Domesticated'],
      words: [
        { label: 'Tiger', emoji: '🐯', color: '#E8590C', vec: [0.85, 0.85, -0.85] },
        { label: 'Wolf', emoji: '🐺', color: '#6C757D', vec: [0.60, 0.80, -0.70] },
        { label: 'House Cat', emoji: '🐱', color: '#B5651D', vec: [-0.80, -0.90, 0.90] },
        { label: 'Rabbit', emoji: '🐰', color: '#F06292', vec: [-0.85, -0.60, 0.60] },
        { label: 'Elephant', emoji: '🐘', color: '#7D8491', vec: [0.95, -0.30, 0.10] },
      ],
    },
    {
      name: 'Tech',
      axes: ['Portability', 'Screen Size', 'Processing Power'],
      words: [
        { label: 'Smartphone', emoji: '📱', color: '#1971C2', vec: [0.80, -0.20, 0.60] },
        { label: 'Desktop PC', emoji: '🖥️', color: '#495057', vec: [-0.90, 0.90, 0.90] },
        { label: 'Smartwatch', emoji: '⌚', color: '#0CA678', vec: [0.95, -0.90, -0.60] },
        { label: 'Laptop', emoji: '💻', color: '#868E96', vec: [0.30, 0.30, 0.50] },
        { label: 'Game Console', emoji: '🎮', color: '#7048E8', vec: [0.10, -0.30, 0.70] },
      ],
    },
  ];

  // Stricter tiers: within ~15% match is PERFECT, matching the requested
  // "close by 15 percent = perfect" scale, cascading down from there.
  function getVerdict(score) {
    if (score >= 85) return 'PERFECT';
    if (score >= 65) return 'GREAT';
    if (score >= 35) return 'OK';
    return 'MISS';
  }
  function scoreColor(score) {
    return lerpColor('#c23b2b', '#1f7a4d', clamp(score / 100, 0, 1));
  }

  // --- shared visual helpers -------------------------------------------------

  var emojiTextureCache = {};
  function makeEmojiTexture(emoji) {
    if (emojiTextureCache[emoji]) return emojiTextureCache[emoji];
    var res = 256;
    var c = document.createElement('canvas');
    c.width = c.height = res;
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, res, res);
    ctx.font = Math.round(res * 0.7) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, res / 2, res / 2 + res * 0.04);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 4;
    tex.generateMipmaps = true;
    emojiTextureCache[emoji] = tex;
    return tex;
  }

  function makeEmojiSprite(emoji, size, opacity) {
    var tex = makeEmojiTexture(emoji);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: opacity === undefined ? 1 : opacity, depthWrite: false });
    var sprite = new THREE.Sprite(mat);
    sprite.scale.set(size, size, size);
    return sprite;
  }

  function makeOriginLine(targetPos, color, opacity) {
    var geom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), targetPos]);
    var mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: opacity });
    return new THREE.Line(geom, mat);
  }

  function makeGuessRing(size) {
    var geom = new THREE.RingGeometry(size * 0.62, size * 0.68, 32);
    var mat = new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
    return new THREE.Mesh(geom, mat);
  }

  function colorizeTubeAlongLength(geometry, colorA, colorB) {
    var uv = geometry.attributes.uv;
    var colors = new Float32Array(uv.count * 3);
    var cA = new THREE.Color(colorA), cB = new THREE.Color(colorB), tmp = new THREE.Color();
    for (var i = 0; i < uv.count; i++) {
      tmp.copy(cA).lerp(cB, uv.getX(i));
      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  function buildAxesInto(scene, axisLen) {
    var group = new THREE.Group();
    var dirs = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];
    dirs.forEach(function (dir) {
      var pts = [dir.clone().multiplyScalar(-axisLen), dir.clone().multiplyScalar(axisLen)];
      var geom = new THREE.BufferGeometry().setFromPoints(pts);
      var mat = new THREE.LineBasicMaterial({ color: 0xC9C2B4, transparent: true, opacity: 0.7 });
      group.add(new THREE.Line(geom, mat));
    });
    var grid = new THREE.GridHelper(axisLen * 2, 10, 0xDCD6C8, 0xE8E3D6);
    grid.position.y = -axisLen;
    group.add(grid);
    scene.add(group);
  }

  // =========================================================================
  // MAIN GAME SCENE
  // =========================================================================

  var scene, camera, renderer, canvasContainer, canvasEl;
  var cameraRig = { theta: Math.PI / 4, phi: Math.PI / 2.6, radius: 8.5 };
  var isDragging = false;
  var lastPointer = { x: 0, y: 0 };
  var particles = null;

  var labelRegistry = [];   // { getPos, text, el, group }
  var meshRegistry = [];    // { mesh, group }
  var axisLabelEntries = [];

  var currentThemeIndex = 0;
  var currentWordIndex = 0;
  var guessVec = [0, 0, 0];
  var wordSubmitted = false;
  var allGuessRings = [];
  var guessSprite, guessRing, guessLine, guessVectorLabelEntry;

  function initMainScene() {
    canvasContainer = document.getElementById('canvasContainer');
    canvasEl = document.getElementById('glcanvas');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF7F4EE);

    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    updateCameraPosition();

    renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resizeRenderer();

    buildAxesInto(scene, AXIS_LEN);
    buildAxisLabels();
    buildParticles();

    new ResizeObserver(resizeRenderer).observe(canvasContainer);
    canvasEl.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    canvasEl.addEventListener('wheel', onWheel, { passive: false });

    requestAnimationFrame(animateMain);
  }

  function updateCameraPosition() {
    var theta = cameraRig.theta, phi = cameraRig.phi, radius = cameraRig.radius;
    camera.position.set(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(0, 0, 0);
  }

  function resizeRenderer() {
    var w = canvasContainer.clientWidth, h = canvasContainer.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }

  function onPointerDown(e) {
    isDragging = true;
    lastPointer.x = e.clientX; lastPointer.y = e.clientY;
    try { canvasEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onPointerMove(e) {
    if (!isDragging) return;
    var dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
    lastPointer.x = e.clientX; lastPointer.y = e.clientY;
    cameraRig.theta -= dx * 0.005;
    cameraRig.phi = clamp(cameraRig.phi - dy * 0.005, 0.3, Math.PI - 0.3);
    updateCameraPosition();
  }
  function onPointerUp() { isDragging = false; }
  function onWheel(e) {
    e.preventDefault();
    cameraRig.radius = clamp(cameraRig.radius + e.deltaY * 0.01, 4, 16);
    updateCameraPosition();
  }

  function makeLabelEl(className, layerEl) {
    var el = document.createElement('div');
    el.className = 'vlabel ' + className;
    layerEl.appendChild(el);
    return el;
  }

  function addLabel(getPos, text, group, className) {
    var el = makeLabelEl(className, document.getElementById('labelLayer'));
    var entry = { getPos: getPos, text: text, el: el, group: group };
    labelRegistry.push(entry);
    return entry;
  }

  function removeLabelsByGroup(group) {
    labelRegistry = labelRegistry.filter(function (entry) {
      if (entry.group === group) { entry.el.remove(); return false; }
      return true;
    });
  }

  function buildAxisLabels() {
    var ends = [
      new THREE.Vector3(AXIS_LEN, 0, 0),
      new THREE.Vector3(0, AXIS_LEN, 0),
      new THREE.Vector3(0, 0, AXIS_LEN),
    ];
    axisLabelEntries = ends.map(function (pos) {
      return addLabel(function () { return pos; }, '', 'axis', 'axis-label');
    });
  }

  function setAxisLabelsText(labels) {
    axisLabelEntries.forEach(function (entry, i) { entry.text = labels[i]; });
  }

  function buildParticles() {
    var count = 180;
    var positions = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var r = 6 + Math.random() * 6;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.random() * Math.PI;
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.cos(phi) * 0.6;
      positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var mat = new THREE.PointsMaterial({ color: 0xD8D2C4, size: 0.035, transparent: true, opacity: 0.8, sizeAttenuation: true });
    particles = new THREE.Points(geom, mat);
    scene.add(particles);
  }

  function addMesh(mesh, group) {
    scene.add(mesh);
    meshRegistry.push({ mesh: mesh, group: group });
    return mesh;
  }

  function removeGroup(group) {
    meshRegistry = meshRegistry.filter(function (entry) {
      if (entry.group === group) {
        scene.remove(entry.mesh);
        if (entry.mesh.geometry) entry.mesh.geometry.dispose();
        var m = entry.mesh.material;
        if (Array.isArray(m)) m.forEach(function (mm) { mm.dispose(); }); else if (m) m.dispose();
        return false;
      }
      return true;
    });
    removeLabelsByGroup(group);
    allGuessRings = allGuessRings.filter(function (ring) { return meshRegistry.some(function (e) { return e.mesh === ring; }); });
  }

  function updateLabels() {
    var rect = canvasContainer.getBoundingClientRect();
    var tmp = new THREE.Vector3();
    labelRegistry.forEach(function (entry) {
      tmp.copy(entry.getPos());
      tmp.project(camera);
      var visible = tmp.z < 1 && entry.text;
      entry.el.style.display = visible ? 'block' : 'none';
      if (visible) {
        var x = (tmp.x * 0.5 + 0.5) * rect.width;
        var y = (-tmp.y * 0.5 + 0.5) * rect.height;
        entry.el.style.left = x + 'px';
        entry.el.style.top = y + 'px';
        if (entry.el.textContent !== entry.text) entry.el.textContent = entry.text;
      }
    });
  }

  function animateMain(now) {
    requestAnimationFrame(animateMain);
    if (!isDragging) {
      cameraRig.theta += 0.0016;
      updateCameraPosition();
    }
    if (particles) particles.rotation.y = now * 0.00002;
    allGuessRings.forEach(function (ring) { ring.quaternion.copy(camera.quaternion); });
    updateLabels();
    renderer.render(scene, camera);
  }

  function buildArc(fromVec3, toVec3, colorA, colorB) {
    var mid = fromVec3.clone().add(toVec3).multiplyScalar(0.5);
    mid.y += 0.9;
    var curve = new THREE.QuadraticBezierCurve3(fromVec3, mid, toVec3);
    var geom = new THREE.TubeGeometry(curve, 40, 0.02, 8, false);
    colorizeTubeAlongLength(geom, colorA, colorB);
    var mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }));
    addMesh(mesh, 'game');
  }

  function dropInWithBounce(obj, targetPos, duration, onComplete) {
    var startPos = targetPos.clone().add(new THREE.Vector3(0, 2.4, 0));
    obj.position.copy(startPos);
    obj.scale.setScalar(0.001);
    var baseScale = obj.userData.baseScale || 1;
    var start = performance.now();
    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = Math.max(0, easeOutElastic(t));
      obj.position.lerpVectors(startPos, targetPos, eased);
      obj.scale.setScalar(eased * baseScale);
      if (t < 1) requestAnimationFrame(tick);
      else { obj.position.copy(targetPos); obj.scale.setScalar(baseScale); if (onComplete) onComplete(); }
    }
    requestAnimationFrame(tick);
  }

  // --- theme / word flow -----------------------------------------------------

  function startTheme(themeIndex) {
    currentThemeIndex = themeIndex;
    var theme = THEMES[currentThemeIndex];
    setAxisLabelsText(theme.axes);
    document.getElementById('themeName').textContent = theme.name;
    document.getElementById('historyList').innerHTML = '';
    document.getElementById('historyPanel').classList.add('hidden');
    loadWord(0);
  }

  function loadWord(wordIndex) {
    removeGroup('game');
    currentWordIndex = wordIndex;
    wordSubmitted = false;
    guessVec = [0, 0, 0];
    var theme = THEMES[currentThemeIndex];
    var word = theme.words[wordIndex % theme.words.length];

    document.getElementById('targetEmoji').textContent = word.emoji;
    var wordEl = document.getElementById('targetWordSpaced');
    wordEl.textContent = word.label.toUpperCase();
    wordEl.style.color = word.color;

    var origin = new THREE.Vector3(0, 0, 0);
    guessSprite = makeEmojiSprite(word.emoji, 0.55, 0.85);
    guessSprite.position.copy(origin);
    addMesh(guessSprite, 'game');

    guessRing = makeGuessRing(0.55);
    guessRing.position.copy(origin);
    addMesh(guessRing, 'game');
    allGuessRings.push(guessRing);

    guessLine = makeOriginLine(origin, ACCENT_COLOR, 0.5);
    addMesh(guessLine, 'game');

    guessVectorLabelEntry = addLabel(function () { return guessSprite.position; }, fmtVecLive(guessVec), 'game', 'guess-vector-label vlabel-below');

    renderControlPanelForWord(theme, word, wordIndex);
    document.getElementById('revealPanel').classList.add('hidden');
    enableSliders();
  }

  function updateGuessVisual() {
    var tip = vecToWorld(guessVec, SCALE);
    guessSprite.position.copy(tip);
    guessRing.position.copy(tip);
    guessLine.geometry.setFromPoints([new THREE.Vector3(0, 0, 0), tip]);
    guessVectorLabelEntry.text = fmtVecLive(guessVec);
  }

  function renderControlPanelForWord(theme, word, wordIndex) {
    var container = document.getElementById('slidersContainer');
    container.innerHTML = '';
    theme.axes.forEach(function (axisName, i) {
      var row = document.createElement('div');
      row.className = 'slider-row';
      row.innerHTML =
        '<div class="slider-row-head"><span>' + axisName + '</span><span class="slider-value" id="sliderVal' + i + '">0.00</span></div>' +
        '<input type="range" min="-1" max="1" step="0.01" value="0" class="vslider" id="slider' + i + '" />';
      container.appendChild(row);
    });
    theme.axes.forEach(function (_, i) {
      document.getElementById('slider' + i).addEventListener('input', function (e) {
        guessVec[i] = parseFloat(e.target.value);
        document.getElementById('sliderVal' + i).textContent = guessVec[i].toFixed(2);
        updateGuessVisual();
      });
    });
  }

  function enableSliders() {
    document.querySelectorAll('.vslider').forEach(function (s) { s.disabled = false; });
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').classList.remove('hidden');
  }
  function disableSliders() {
    document.querySelectorAll('.vslider').forEach(function (s) { s.disabled = true; });
  }

  function handleSubmit() {
    if (wordSubmitted) return;
    wordSubmitted = true;
    disableSliders();

    var theme = THEMES[currentThemeIndex];
    var word = theme.words[currentWordIndex % theme.words.length];
    var cos = cosineSimilarity(guessVec, word.vec);
    var score = Math.round(Math.max(0, cos) * 100);

    var guessTip = guessSprite.position.clone();
    var truePos = vecToWorld(word.vec, SCALE);
    var wordColorNum = parseInt(word.color.slice(1), 16);

    var trueSprite = makeEmojiSprite(word.emoji, 0.6, 1);
    trueSprite.userData.baseScale = 0.6;
    addMesh(trueSprite, 'game');
    var trueLabel = addLabel(function () { return trueSprite.position; }, word.label, 'game', 'vlabel-target');
    trueLabel.el.style.color = word.color;
    addMesh(makeOriginLine(truePos, wordColorNum, 0.5), 'game');

    dropInWithBounce(trueSprite, truePos, 900, function () {
      buildArc(guessTip, truePos, ACCENT_COLOR, wordColorNum);
    });

    buildRevealContent(word, score);
    pushHistory(word, score);
  }

  function buildRevealContent(word, score) {
    var color = scoreColor(score);
    var badge = document.getElementById('rankBadge');
    badge.textContent = getVerdict(score);
    badge.style.background = color;
    document.getElementById('revealScore').textContent = score + '%';
    document.getElementById('revealScore').style.color = color;
    document.getElementById('revealYourVec').textContent = fmtVec(guessVec);
    document.getElementById('revealTrueVec').textContent = fmtVec(word.vec);
    document.getElementById('submitBtn').classList.add('hidden');
    document.getElementById('revealPanel').classList.remove('hidden');
  }

  function pushHistory(word, score) {
    var panel = document.getElementById('historyPanel');
    panel.classList.remove('hidden');
    var list = document.getElementById('historyList');
    var item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = '<span class="hi-word">' + word.emoji + ' ' + word.label + '</span><span class="hi-score" style="color:' + scoreColor(score) + '">' + score + '%</span>';
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
  }

  function handleNextWord() {
    var theme = THEMES[currentThemeIndex];
    var nextIndex = (currentWordIndex + 1) % theme.words.length;
    loadWord(nextIndex);
  }

  function handleReset() {
    var nextTheme = (currentThemeIndex + 1) % THEMES.length;
    startTheme(nextTheme);
  }

  // =========================================================================
  // MINI DEMO SCENE (King / Queen / Prince / Princess)
  // =========================================================================

  var demoScene, demoCamera, demoRenderer, demoContainer, demoCanvasEl;
  var demoCameraTheta = 0.6;
  var demoMeshes = [];
  var demoLabels = [];
  var demoTimers = [];
  var demoPlaybackToken = 0;
  var demoRunning = false;

  function initDemoScene() {
    demoContainer = document.getElementById('demoCanvasWrap');
    demoCanvasEl = document.getElementById('demoCanvas');

    demoScene = new THREE.Scene();
    demoScene.background = new THREE.Color(0xFFFFFF);

    demoCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 50);

    demoRenderer = new THREE.WebGLRenderer({ canvas: demoCanvasEl, antialias: true });
    demoRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    resizeDemoRenderer();

    buildAxesInto(demoScene, DEMO_AXIS_LEN);
    buildDemoAxisLabels();

    new ResizeObserver(resizeDemoRenderer).observe(demoContainer);
    requestAnimationFrame(animateDemo);
  }

  function resizeDemoRenderer() {
    var w = demoContainer.clientWidth, h = demoContainer.clientHeight;
    if (!w || !h) return;
    demoCamera.aspect = w / h;
    demoCamera.updateProjectionMatrix();
    demoRenderer.setSize(w, h, false);
  }

  function updateDemoCameraPosition() {
    var radius = 6.2, phi = 1.15;
    demoCamera.position.set(
      radius * Math.sin(phi) * Math.cos(demoCameraTheta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(demoCameraTheta)
    );
    demoCamera.lookAt(0, 0, 0);
  }

  function makeDemoLabelEl(className) {
    return makeLabelEl(className, document.getElementById('demoLabelLayer'));
  }

  function buildDemoAxisLabels() {
    var ends = [
      new THREE.Vector3(DEMO_AXIS_LEN, 0, 0),
      new THREE.Vector3(0, DEMO_AXIS_LEN, 0),
      new THREE.Vector3(0, 0, DEMO_AXIS_LEN),
    ];
    ends.forEach(function (pos, i) {
      var el = makeDemoLabelEl('demo-axis-label');
      el.textContent = DEMO_AXES[i];
      demoLabels.push({ getPos: function () { return pos; }, el: el, isAxis: true });
    });
  }

  function clearDemoWordVisuals() {
    demoMeshes.forEach(function (mesh) {
      demoScene.remove(mesh);
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
    });
    demoMeshes = [];
    demoLabels = demoLabels.filter(function (entry) {
      if (entry.isAxis) return true;
      entry.el.remove();
      return false;
    });
  }

  function updateDemoLabels() {
    var rect = demoContainer.getBoundingClientRect();
    var tmp = new THREE.Vector3();
    demoLabels.forEach(function (entry) {
      tmp.copy(entry.getPos());
      tmp.project(demoCamera);
      var visible = tmp.z < 1;
      entry.el.style.display = visible ? 'block' : 'none';
      if (visible) {
        entry.el.style.left = ((tmp.x * 0.5 + 0.5) * rect.width) + 'px';
        entry.el.style.top = ((-tmp.y * 0.5 + 0.5) * rect.height) + 'px';
      }
    });
  }

  function animateDemo(now) {
    requestAnimationFrame(animateDemo);
    if (demoRunning) {
      demoCameraTheta += 0.0028;
      updateDemoCameraPosition();
      updateDemoLabels();
      demoRenderer.render(demoScene, demoCamera);
    }
  }

  function addDemoWordPoint(word) {
    var pos = vecToWorld(word.vec, DEMO_SCALE);
    var sprite = makeEmojiSprite(word.emoji, 0.5, 0);
    sprite.position.copy(pos);
    demoScene.add(sprite);
    demoMeshes.push(sprite);

    var line = makeOriginLine(pos, parseInt(word.color.slice(1), 16), 0);
    demoScene.add(line);
    demoMeshes.push(line);

    var labelEl = makeDemoLabelEl('demo-word-label');
    labelEl.textContent = word.label;
    labelEl.style.color = word.color;
    labelEl.style.opacity = '0';
    demoLabels.push({ getPos: function () { return sprite.position; }, el: labelEl, isAxis: false });

    var start = performance.now();
    var duration = 550;
    function tick(nowT) {
      var t = Math.min(1, (nowT - start) / duration);
      var eased = Math.max(0, easeOutElastic(t));
      sprite.material.opacity = Math.min(1, eased);
      sprite.scale.setScalar(0.5 * Math.min(1.15, Math.max(0.001, eased)));
      line.material.opacity = Math.min(0.55, eased * 0.55);
      labelEl.style.opacity = String(Math.min(1, eased));
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function typeCodeLine(lineEl, word, timerBag, token) {
    return new Promise(function (resolve) {
      lineEl.textContent = word.varName + (word.varName.length < 8 ? ' '.repeat(8 - word.varName.length) : '') + ' = [';
      var i = 0;
      function next() {
        if (token !== demoPlaybackToken) { resolve(); return; }
        if (i >= word.vec.length) { lineEl.textContent += ' ]'; resolve(); return; }
        var val = word.vec[i].toFixed(2);
        lineEl.textContent += (i > 0 ? ', ' : '') + (word.vec[i] >= 0 ? ' ' : '') + val;
        i++;
        timerBag.push(setTimeout(next, 300));
      }
      next();
    });
  }

  async function playDemo() {
    var token = ++demoPlaybackToken;
    demoTimers.forEach(clearTimeout);
    demoTimers = [];
    clearDemoWordVisuals();
    document.getElementById('demoCode').innerHTML = '';
    demoRunning = true;

    for (var i = 0; i < DEMO_WORDS.length; i++) {
      if (token !== demoPlaybackToken) return;
      var word = DEMO_WORDS[i];
      var lineEl = document.createElement('div');
      lineEl.className = 'code-line';
      document.getElementById('demoCode').appendChild(lineEl);

      await typeCodeLine(lineEl, word, demoTimers, token);
      if (token !== demoPlaybackToken) return;
      addDemoWordPoint(word);
      await sleep(1500, demoTimers);
    }

    if (token !== demoPlaybackToken) return;
    await sleep(1800, demoTimers);
    if (token !== demoPlaybackToken) return;
    minimizeDemo();
  }

  function minimizeDemo() {
    demoPlaybackToken++;
    demoTimers.forEach(clearTimeout);
    demoTimers = [];
    demoRunning = false;
    document.getElementById('demoWindow').classList.add('hidden');
    document.getElementById('demoPill').style.display = 'flex';
  }

  function expandDemo() {
    document.getElementById('demoWindow').classList.remove('hidden');
    document.getElementById('demoPill').style.display = 'none';
    demoRunning = true;
    playDemo();
  }

  // --- export modal -----------------------------------------------------

  function wireExportModal() {
    var modal = document.getElementById('exportModal');
    document.getElementById('exportBtn').addEventListener('click', function () {
      document.getElementById('exportTextarea').value = document.documentElement.outerHTML;
      modal.classList.remove('hidden');
    });
    document.getElementById('closeExportBtn').addEventListener('click', function () {
      modal.classList.add('hidden');
    });
    document.getElementById('copyExportBtn').addEventListener('click', function () {
      var ta = document.getElementById('exportTextarea');
      var btn = document.getElementById('copyExportBtn');
      function done() { btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = 'Copy HTML'; }, 1500); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done).catch(function () {
          ta.select(); document.execCommand('copy'); done();
        });
      } else {
        ta.select(); document.execCommand('copy'); done();
      }
    });
  }

  // --- bootstrap -----------------------------------------------------------

  function wireStaticButtons() {
    document.getElementById('submitBtn').addEventListener('click', handleSubmit);
    document.getElementById('nextWordBtn').addEventListener('click', handleNextWord);
    document.getElementById('resetBtn').addEventListener('click', handleReset);
    document.getElementById('demoCloseBtn').addEventListener('click', minimizeDemo);
    document.getElementById('demoPill').addEventListener('click', expandDemo);
    wireExportModal();
  }

  window.addEventListener('DOMContentLoaded', function () {
    initMainScene();
    startTheme(0);
    initDemoScene();
    wireStaticButtons();
    demoRunning = true;
    playDemo();
  });
})();
</script>
